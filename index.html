</script>
<style>
/* Layout: a registrar's desk — header band with the school name, tabbed workspace, A4 paper preview on the issue screen */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#d9dee7;
  --ink:#18202d; --muted:#4f596a; --accent:#1d4f8c; --accent-ink:#ffffff; --accent-soft:#e3ecf8;
  --accent-hover:#163d70; --field:#8a94a6; --focus:#1d4f8c; --gold:#c99a2e; --band:#163d70;
  --seal:#a8261b; --seal-soft:#f8e6e3; --ok:#1f7a4a; --ok-soft:#e2f2e8; --warn:#8a5a00; --warn-soft:#fbf0d9;
  --f-ui:"Sarabun","Leelawadee UI",Tahoma,system-ui,-apple-system,sans-serif;
  --f-doc:"THSarabunNew","TH Sarabun New","TH SarabunPSK","Sarabun",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161e; --surface:#19202b; --surface-2:#212a37; --line:#2f3a4a;
  --ink:#e6eaf1; --muted:#a7b1c1; --accent:#7fb0ee; --accent-ink:#0e1520; --accent-soft:#1d2d44;
  --accent-hover:#9cc3f3; --field:#5d6b80; --focus:#9cc3f3; --gold:#f0c060; --band:#7fb0ee;
  --seal:#f08a7e; --seal-soft:#3a1f1c; --ok:#6fcf97; --ok-soft:#173025; --warn:#f0c060; --warn-soft:#3a2f14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --surface-2:#212a37; --line:#2f3a4a;
  --ink:#e6eaf1; --muted:#a7b1c1; --accent:#7fb0ee; --accent-ink:#0e1520; --accent-soft:#1d2d44;
  --accent-hover:#9cc3f3; --field:#5d6b80; --focus:#9cc3f3; --gold:#f0c060; --band:#7fb0ee;
  --seal:#f08a7e; --seal-soft:#3a1f1c; --ok:#6fcf97; --ok-soft:#173025; --warn:#f0c060; --warn-soft:#3a2f14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--band)}
header.top .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}

const STATUSES = {active:"กำลังศึกษา",grad:"สำเร็จการศึกษา",moved:"ย้ายออก",quit:"ลาออก",pause:"พักการเรียน"};
const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DOCTYPES = {
  student:{name:"หนังสือรับรองการเป็นนักเรียน",note:"สำหรับนักเรียนที่กำลังศึกษา",need:"active"},
  conduct:{name:"หนังสือรับรองความประพฤติ",note:"รับรองความประพฤติ ใช้สมัครเรียนต่อ/ทุน",need:null},
  grad:{name:"หนังสือรับรองการสำเร็จการศึกษา",note:"ใช้ระหว่างรอ ปพ.1 / ปพ.2",need:"grad"},
  moved:{name:"หนังสือส่งตัวนักเรียน (แบบ พฐ.๑๙/๑)",short:"หนังสือส่งตัวนักเรียน",note:"หนังสือภายนอกถึงสถานศึกษาที่รับย้าย พร้อมหลักฐานการศึกษา",need:"moved",letter:true}
};
const DEFAULT_SCHOOL = {name:"",address:"",affiliation:"",director:"",directorPos:"",registrar:"",phone:"",docPrefix:"ศธ ",numMode:"own",crutTop:"1.5",showTitle:false,year:"",curriculum:"หลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช ๒๕๕๑",curriculumEarly:"หลักสูตรการศึกษาปฐมวัย พุทธศักราช ๒๕๖๐",thaiDigits:true,logo:""};

// เอกสารที่ไม่ได้ออกให้นักเรียนรายคน แต่ลงทะเบียนคุมเลขเดียวกัน
const OTHER_TYPES = {outgoing:{name:"หนังสือส่ง (จองเลข)"}, order:{name:"คำสั่งโรงเรียน"}, purchase:{name:"หนังสือขอซื้อแบบพิมพ์"}};
const typeName = t => (DOCTYPES[t]||OTHER_TYPES[t])?.name || t;

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const h = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thDigits = s => String(s).replace(/\d/g,d=>"๐๑๒๓๔๕๖๗๘๙"[d]);
// เลขไทยใช้เฉพาะในเอกสาร (ตามตั้งค่า) หน้าจอโปรแกรมใช้เลขอารบิก — document renderers run inside docRender()
let inDoc=0;
const D = s => (inDoc>0 && state.school.thaiDigits) ? thDigits(s) : String(s);
const docRender = f => function(...a){ inDoc++; try{ return f.apply(this,a); } finally{ inDoc--; } };
const beYearNow = () => new Date().getFullYear()+543;
const defaultAcadYear = () => { const n=new Date(); return (n.getMonth()<4 ? n.getFullYear()-1 : n.getFullYear())+543; };
function thaiDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); if(!y) return ""; return D(`${d} ${MONTHS[m-1]} ${y+543}`); }
function thaiDateShort(iso){ if(!iso) return "–"; const [y,m,d]=iso.split("-").map(Number); return `${d}/${m}/${y+543}`; }
function todayISO(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }
// เลข G = เลขประจำตัวที่สถานศึกษาออกให้ผู้ไม่มีเลขประจำตัวประชาชน (G + ๑๒ หลัก) ตรวจได้เฉพาะรูปแบบ
const cidClean = v => { v=String(v||"").replace(/[๐-๙]/g,c=>"๐๑๒๓๔๕๖๗๘๙".indexOf(c)).toUpperCase().replace(/[^0-9G]/g,""); return /^G/.test(v) ? "G"+v.slice(1).replace(/G/g,"") : v.replace(/G/g,""); };
function cidValid(c){ if(/^G\d{12}$/.test(c)) return true; if(!/^\d{13}$/.test(c)) return false; let s=0; for(let i=0;i<12;i++) s+= +c[i]*(13-i); return (11 - s%11)%10 === +c[12]; }
function cidFmt(c){ return /^\d{13}$/.test(c||"") ? `${c[0]}-${c.slice(1,5)}-${c.slice(5,10)}-${c.slice(10,12)}-${c[12]}` : (c||""); }
const DATE_KEYS=["birthDate","enrollDate","leaveDate","moveInDate"];
const isMale = s => s.gender ? s.gender==="ชาย" : ["เด็กชาย","นาย"].includes(s.prefix);
// ปีการศึกษา พ.ศ. y นับตั้งแต่ ๑ พ.ค. ถึง ๓๐ เม.ย. ปีถัดไป (ตรงกับ defaultAcadYear)
const inAcadYear = (iso,y) => !!iso && iso>=`${y-543}-05-01` && iso<=`${y-542}-04-30`;
function ageAt(birth, ref){ if(!birth) return null; const [by,bm,bd]=birth.split("-").map(Number), [ry,rm,rd]=ref.split("-").map(Number); return ry-by-((rm<bm||(rm===bm&&rd<bd))?1:0); }
const fullName = s => `${s.prefix||""}${s.firstName||""} ${s.lastName||""}`.trim();
function gradeFull(g){ if(!g) return ""; const [k,n]=g.split("."); const base={"อ":"อนุบาลปีที่","ป":"ประถมศึกษาปีที่","ม":"มัธยมศึกษาปีที่"}[k]; return base ? `${base} ${D(n)}` : g; }
function gradeClass(s){ return s.room ? `${gradeFull(s.grade)}/${D(s.room)}` : gradeFull(s.grade); }
function gradeGrad(g){ return g==="อ.3" ? "ระดับปฐมวัย (ชั้นอนุบาลปีที่ ๓)" : g==="ป.6" ? "ชั้นประถมศึกษาปีที่ ๖" : g==="ม.3" ? "ระดับมัธยมศึกษาตอนต้น (ชั้นมัธยมศึกษาปีที่ ๓)" : g==="ม.6" ? "ระดับมัธยมศึกษาตอนปลาย (ชั้นมัธยมศึกษาปีที่ ๖)" : "ชั้น"+gradeFull(g); }
function statusChip(st){ const cls={active:"s-active",grad:"s-grad",moved:"s-moved",quit:"s-quit",pause:"s-pause"}[st]||""; return `<span class="chip ${cls}">${h(STATUSES[st]||st||"–")}</span>`; }
// a toast must sit above modal dialogs, so it goes into the top layer as a popover (or inside the open dialog on older browsers)
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  if(t.showPopover){ t.popover="manual"; document.body.appendChild(t); try{ t.showPopover(); }catch{} }
  else ([...document.querySelectorAll("dialog[open]")].pop()||document.body).appendChild(t);
  setTimeout(()=>t.remove(),3200); }
function lsGet(k){ try{return localStorage.getItem(k);}catch{return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch{} }

/* ---------- state + store ---------- */
const state = {school:{...DEFAULT_SCHOOL}, students:[], studentsAll:[], trash:[], batches:[], forms:[], issued:[], loaded:{school:false,students:false,issued:false}, db:null, dl:null, offline:false, readOnly:false, slow:false};
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* local mode: when the page is opened outside claude.ai (a file on this computer, any web host)
   data is kept in this browser's IndexedDB so it survives closing the page */
const local = {
  db:null, ok:false,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open("student-registry",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");
    r.onsuccess=()=>{ this.db=r.result; this.ok=true; res(true); }; r.onerror=()=>res(false); r.onblocked=()=>res(false); }catch{ res(false); } }); },
  get(k){ return new Promise(res=>{ if(!this.ok) return res(undefined); try{ const r=this.db.transaction("kv").objectStore("kv").get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>res(undefined); }catch{ res(undefined); } }); },
  put(k,v){ return new Promise((res,rej)=>{ if(!this.ok) return res(); try{ const t=this.db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k);
    t.oncomplete=()=>res(); t.onerror=t.onabort=()=>{ const e=t.error||new Error("write failed"); if(e.name==="QuotaExceededError") e.code="quota_exceeded"; rej(e); }; }catch(e){ rej(e); } }); }
};
// students in the trash keep a deletedAt stamp; every screen works on state.students (not deleted)
function setStudents(all){ state.studentsAll=all; state.students=all.filter(s=>!s.deletedAt); state.trash=all.filter(s=>s.deletedAt); }
const rawCol = col => col==="students" ? state.studentsAll : (state[col]||[]);
const setCol = (col,a) => { if(col==="students") setStudents(a); else state[col]=a; };
const sortIssued = a => a.sort((x,y)=>String(y.createdAt||"").localeCompare(String(x.createdAt||"")));
async function saveDoc(col, id, data){
  if(state.db){ await state.db.collection(col).doc(id).set(data); return; }
  const next=rawCol(col).filter(x=>x._id!==id).concat({...data,_id:id}); if(col==="issued") sortIssued(next);
  await local.put(col, next); setCol(col,next); renderAll();
}
async function deleteDoc(col,id){
  if(state.db){ await state.db.collection(col).doc(id).delete(); return; }
  const next=rawCol(col).filter(x=>x._id!==id); await local.put(col, next); setCol(col,next); renderAll();
}
// import many rows with one write in local mode (one write per row would be slow)
async function saveMany(col, items, onProgress){
  if(state.db){ let n=0; for(const [id,data] of items){ await state.db.collection(col).doc(id).set(data); onProgress(++n); } return; }
  const map=new Map(rawCol(col).map(x=>[x._id,x])); items.forEach(([id,data])=>map.set(id,{...data,_id:id}));
  const next=[...map.values()]; await local.put(col,next); setCol(col,next); onProgress(items.length); renderAll();
}
async function saveSchool(data){
  if(state.db){ await state.db.doc("config/school").set(data); return; }
  await local.put("school", data); state.school={...DEFAULT_SCHOOL,...data}; renderAll();
}
function writeErr(e){
  if(e && e.code==="invalid_argument"){ state.readOnly=true; renderBanner(); toast("คุณมีสิทธิ์ดูอย่างเดียว บันทึกข้อมูลไม่ได้"); }
  else if(e && e.code==="quota_exceeded") toast("พื้นที่ฐานข้อมูลเต็ม ลบข้อมูลเก่าที่ไม่ใช้ก่อนแล้วลองอีกครั้ง");
  else toast("บันทึกไม่สำเร็จ ลองอีกครั้ง");
  console.error(e);
}

async function boot(){
  renderAll();
  let db=null, dl=null;
  try{ db = await (window.claude?.use?.("db") ?? null); }catch{ db=null; }
  try{ dl = await (window.claude?.use?.("downloads") ?? null); }catch{ dl=null; }
  state.dl = dl;
  if(!db){
    state.offline=true; state.local=await local.open();
    if(state.local){ state.school={...DEFAULT_SCHOOL,...(await local.get("school")||{})}; setStudents(await local.get("students")||[]); state.batches=await local.get("batches")||[]; state.forms=await local.get("forms")||[]; state.issued=sortIssued(await local.get("issued")||[]);
      try{ navigator.storage?.persist?.(); }catch{} }
    Object.keys(state.loaded).forEach(k=>state.loaded[k]=true); renderAll(); return; }
  state.db = db;
  const timer = setTimeout(()=>{ state.slow=true; renderBanner(); },10000);
  const done = () => { if(Object.values(state.loaded).every(Boolean)){ clearTimeout(timer); state.slow=false; renderBanner(); } };
  const onErr = e => { clearTimeout(timer); console.error(e); state.offline=true; Object.keys(state.loaded).forEach(k=>state.loaded[k]=true); renderAll(); };
  db.doc("config/school").onSnapshot(s=>{
    state.school = {...DEFAULT_SCHOOL, ...(s.exists ? s.data() : {})};
    if(!s.metadata.fromCache) state.loaded.school=true; done(); renderAll();
  }, onErr);
  db.collection("students").onSnapshot(s=>{
    setStudents(s.docs.map(d=>({...d.data(),_id:d.id})));
    if(!s.metadata.fromCache) state.loaded.students=true; done(); renderAll();
  }, onErr);
  db.collection("forms").onSnapshot(s=>{ state.forms=s.docs.map(d=>({...d.data(),_id:d.id})); renderAll(); }, e=>console.error(e));
  db.collection("batches").onSnapshot(s=>{ state.batches=s.docs.map(d=>({...d.data(),_id:d.id})); renderAll(); }, e=>console.error(e));
  db.collection("issued").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>{
    state.issued = s.docs.map(d=>({...d.data(),_id:d.id}));
    if(!s.metadata.fromCache) state.loaded.issued=true; done(); renderAll();
  }, onErr);
}

/* ---------- navigation ---------- */
let view = "overview";
const VIEWS=["overview","students","issue","log","letters","reports","setup"];
function go(v){ if(!VIEWS.includes(v)) v="overview"; view=v;
  document.querySelector(`nav.tabs button[data-view="${v}"]`)?.scrollIntoView({block:"nearest",inline:"nearest"});
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.view===v)));
  VIEWS.forEach(x=>$("#v-"+x).hidden = x!==v);
  if(location.hash.slice(1)!==v) history.replaceState(null,"","#"+v);
  renderAll(); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));
addEventListener("hashchange",()=>go(location.hash.slice(1)));

/* ---------- render ---------- */
function renderAll(){ renderHeader(); renderBanner();
  if(view==="overview") renderOverview(); else if(view==="students") renderStudents();
  else if(view==="issue") renderIssue(); else if(view==="log") renderLog(); else if(view==="reports") renderReports(); else if(view==="letters") renderLetters(); else if(!$("#fSchool")?.contains(document.activeElement)) renderSettings(); }

function renderHeader(){
  const s=state.school;
  $("#brandName").textContent = s.name || "งานทะเบียนนักเรียน";
  $("#brandSub").textContent = s.name ? (s.affiliation || s.address || "งานทะเบียนและวัดผล") : "ตั้งชื่อสถานศึกษาได้ที่แท็บ “ตั้งค่า”";
  $("#brandMark").innerHTML = s.schoolLogo ? `<img src="${h(s.schoolLogo)}" alt="">` : "ร";
  $("#yearPill").textContent = "ปีการศึกษา " + D(s.year || defaultAcadYear());
}
function renderBanner(){
  const b=$("#banner"); let msg="";
  if(state.offline && !state.db && state.local){ const lb=lsGet("reg.lastBackup"); const days=lb?Math.floor((Date.now()-Date.parse(lb))/864e5):null;
    msg = state.students.length && (days===null || days>30)
      ? `ยังไม่ได้สำรองข้อมูล${days===null?"":`มา ${D(days)} วัน`} ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น กด “สำรองข้อมูล” ที่แท็บตั้งค่า แล้วเก็บไฟล์ไว้ที่อื่นด้วย`
      : "ทำงานบนเครื่องนี้ ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ควรกด “สำรองข้อมูล” ที่แท็บตั้งค่าเป็นประจำ และอย่าล้างข้อมูลเว็บไซต์ของเบราว์เซอร์"; }
  else if(state.offline && !state.db) msg="เบราว์เซอร์นี้ไม่อนุญาตให้เก็บข้อมูล (อาจเปิดโหมดไม่ระบุตัวตน) ข้อมูลที่กรอกจะหายเมื่อปิดหน้า";
  else if(state.offline) msg="การเชื่อมต่อฐานข้อมูลขาดหาย ข้อมูลที่แสดงอาจไม่เป็นปัจจุบัน";
  else if(state.slow) msg="ยังโหลดข้อมูลไม่ครบ ข้อมูลที่แสดงอาจไม่เป็นปัจจุบัน";
  else if(state.readOnly) msg="คุณมีสิทธิ์ดูอย่างเดียว ขอสิทธิ์ผู้ร่วมแก้ไขจากเจ้าของหน้านี้หากต้องการบันทึกข้อมูล";
  b.innerHTML = msg ? `<div class="banner" role="status">${h(msg)}</div>` : "";
}
const loading = () => !Object.values(state.loaded).every(Boolean);

function renderOverview(){
  const el=$("#v-overview"), st=state.students;
  const by = k => st.filter(s=>s.status===k).length;
  const active = st.filter(s=>s.status==="active");
  const gradesUsed = GRADES.filter(g=>active.some(s=>s.grade===g));
  const isM = isMale;
  let rows = gradesUsed.map(g=>{ const a=active.filter(s=>s.grade===g); const m=a.filter(isM).length; const rooms=new Set(a.map(s=>s.room||"")).size;
    return `<tr><td>${h(gradeFull(g))}</td><td class="num">${D(rooms)}</td><td class="num">${D(m)}</td><td class="num">${D(a.length-m)}</td><td class="num"><b>${D(a.length)}</b></td></tr>`; }).join("");
  const mt = active.filter(isM).length;
  if(rows) rows += `<tr><td><b>รวม</b></td><td></td><td class="num"><b>${D(mt)}</b></td><td class="num"><b>${D(active.length-mt)}</b></td><td class="num"><b>${D(active.length)}</b></td></tr>`;
  const thisYear = state.issued.filter(d=>d.year===beYearNow() && !d.voided);
  const recent = state.issued.slice(0,6).map(d=>`<tr><td class="mono">${h(D(d.number))}</td><td>${h(typeName(d.type))}</td><td>${h(d.studentName)}</td><td>${h(thaiDateShort(d.date))}</td></tr>`).join("");
  el.innerHTML = `
  <h2>ภาพรวมงานทะเบียน</h2><p class="sub">ข้อมูล ณ วันที่ ${h(thaiDate(todayISO()))}${loading()?" · กำลังโหลด…":""}</p>
  <div class="stats">
    <div class="stat"><b>${D(by("active"))}</b><span>กำลังศึกษา</span></div>
    <div class="stat"><b>${D(by("grad"))}</b><span>สำเร็จการศึกษา</span></div>
    <div class="stat"><b>${D(by("moved")+by("quit"))}</b><span>ย้ายออก / ลาออก</span></div>
    <div class="stat"><b>${D(thisYear.length)}</b><span>เอกสารที่ออกในปี ${D(beYearNow())}</span></div>
  </div>
  ${lowStockHTML()}
  <div class="grid2">
    <div class="panel"><h3>จำนวนนักเรียนที่กำลังศึกษา แยกตามชั้นและเพศ</h3>
      ${rows ? `<div class="tablebox"><table><thead><tr><th>ชั้น</th><th class="num">ห้อง</th><th class="num">ชาย</th><th class="num">หญิง</th><th class="num">รวม</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="empty"><b>ยังไม่มีข้อมูลนักเรียน</b>เพิ่มทีละคน หรือนำเข้าจากไฟล์ CSV ที่แท็บ “ทะเบียนนักเรียน”<div style="margin-top:12px"><button class="btn primary" data-act="go-students">ไปที่ทะเบียนนักเรียน</button></div></div>`}
    </div>
    <div class="panel"><h3>เอกสารที่ออกล่าสุด</h3>
      ${recent ? `<div class="tablebox"><table><thead><tr><th>เลขที่</th><th>ประเภท</th><th>นักเรียน</th><th>วันที่</th></tr></thead><tbody>${recent}</tbody></table></div>`
        : `<div class="empty"><b>ยังไม่มีการออกเอกสาร</b>เลือกนักเรียนและประเภทหนังสือที่แท็บ “ออกเอกสาร” ระบบจะรันเลขที่และลงทะเบียนคุมให้อัตโนมัติ</div>`}
    </div>
  </div>
  ${!state.school.name ? `<div class="panel" style="margin-top:20px"><h3>เริ่มต้นใช้งาน</h3><p class="sub" style="margin:0 0 12px">กรอกชื่อสถานศึกษา ผู้อำนวยการ และเลขที่หนังสือก่อน ข้อมูลนี้จะไปปรากฏบนเอกสารทุกฉบับ</p><button class="btn primary" data-act="go-settings">ตั้งค่าสถานศึกษา</button></div>`:""}`;
}

/* students list */
const filt = {q:lsGet("reg.q")||"", grade:"", status:"active"};
function renderStudents(){
  const el=$("#v-students");
  if(!el.dataset.built){

$("#fStudent").addEventListener("submit", async e=>{
  e.preventDefault(); if(state.readOnly){ toast("คุณมีสิทธิ์ดูอย่างเดียว"); return; }
  const fd=new FormData(e.target); const d={}; for(const [k,v] of fd) d[k]=String(v).trim();
  d.citizenId=cidClean(d.citizenId);
  delete d._addrPreview; Object.assign(d, cleanAddr(d)); d.address = composeAddr(d);
  if(d.addrZip && !/^\d{5}$/.test(d.addrZip)){ toast("รหัสไปรษณีย์ต้องเป็นตัวเลข ๕ หลัก"); return; }
  const missing=[["studentId","เลขประจำตัวนักเรียน"],["grade","ชั้น"],["firstName","ชื่อ"],["lastName","นามสกุล"]].filter(([k])=>!d[k]);
  document.querySelectorAll("#fStudent label.err").forEach(l=>l.classList.remove("err"));
  if(missing.length){ missing.forEach(([k])=>$("#sf-"+k)?.closest("label")?.classList.add("err")); $("#sf-"+missing[0][0])?.focus(); toast("กรอก "+missing.map(m=>m[1]).join(", ")+" ก่อนบันทึก"); return; }
  if(d.citizenId && !cidValid(d.citizenId)){ toast("เลขประจำตัวประชาชนไม่ถูกต้อง แก้ไขหรือเว้นว่างไว้"); return; }
  const dup = state.studentsAll.find(s=>s.studentId===d.studentId && s._id!==editing?._id);
  if(dup){ toast(`เลขประจำตัว ${d.studentId} ซ้ำกับ ${fullName(dup)}${dup.deletedAt?" (อยู่ในถังขยะ)":""}`); return; }
  // someone else saved this student while the form was open: ask before overwriting
  const cur = editing && state.studentsAll.find(s=>s._id===editing._id);
  if(cur && (cur.updatedAt||"")!==(editing.updatedAt||"") && !await confirmBox("ข้อมูลถูกแก้จากที่อื่น",`มีผู้บันทึกข้อมูลของ <b>${h(fullName(cur))}</b> หลังจากที่คุณเปิดฟอร์มนี้ ถ้าบันทึก ช่องที่คุณกรอกจะทับข้อมูลนั้น`,"บันทึกทับ")) return;
  const id = editing?._id || newId();
  const body = {...(cur||editing||{}), ...d, updatedAt:new Date().toISOString()}; delete body._id; delete body.example;
  if(!editing) body.createdAt=body.updatedAt;
  $("#btnSaveStudent").disabled=true;

  catch(err){ writeErr(err); } finally{ $("#btnSaveStudent").disabled=false; }
});

// Rasterise the sheet with the browser's own text layout (SVG foreignObject), so Thai line breaks and
// vowel/tone-mark stacking match the on-screen preview exactly; then place the image on an A4 PDF page.
function paperCSS(){
  let css="";
  for(const sh of document.styleSheets){ let rules; try{ rules=sh.cssRules; }catch{ continue; }
    for(const r of rules){ const t=r.cssText; if(t.startsWith("@font-face") && t.includes("THSarabunNew")) css+=t+"\n"; else if(r.selectorText && r.selectorText.includes(".paper")) css+=t+"\n"; } }
  return css;
}
async function renderPaperCanvas(html, scale=3){
  const W=794, H=1123; // A4 at 96 dpi
  const wrap=document.createElement("div");
  wrap.setAttribute("style",`width:${W}px;height:${H}px;background:#fff;--f-doc:"THSarabunNew","TH Sarabun New",sans-serif`);
  wrap.innerHTML=html;
  const pp=wrap.firstElementChild; pp.style.boxShadow="none"; pp.style.margin="0";
  const st=document.createElement("style"); st.textContent=paperCSS(); wrap.prepend(st);
  const xhtml=new XMLSerializer().serializeToString(wrap);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*scale}" height="${H*scale}" viewBox="0 0 ${W} ${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">${xhtml}</foreignObject></svg>`;
  const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  {
    const img=new Image(); img.decoding="sync";
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error("svg render failed")); img.src=url; });
    try{ await img.decode(); }catch{}
    await new Promise(r=>setTimeout(r,60)); // let the embedded font settle before drawing
    const c=document.createElement("canvas"); c.width=W*scale; c.height=H*scale;
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return c;
  }
}
async function buildPdf(html){
  const tmp=document.createElement("div"); tmp.innerHTML=html;
  const pages=[...tmp.children].filter(x=>x.classList.contains("paper")).map(x=>x.outerHTML); if(!pages.length) pages.push(html);
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
  for(let i=0;i<pages.length;i++){ const c=await renderPaperCanvas(pages[i],3); if(i) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297,undefined,"FAST"); }
  return pdf.output("blob");
}
window.__regTest={renderPaperCanvas,buildPdf,paperHTML:(...a)=>paperHTML(...a)};
// save a file: through claude.ai when available, otherwise a normal browser download
async function saveFile(name, data){
  if(state.dl) return state.dl.save({filename:name, data});
  const blob = data instanceof Blob ? data : new Blob([data],{type:/\.csv$/i.test(name)?"text/csv;charset=utf-8":"application/octet-stream"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function printPages(html){ const a=$("#printArea"); a.innerHTML=html; document.body.classList.add("printing");
  const done=()=>{ document.body.classList.remove("printing"); a.innerHTML=""; removeEventListener("afterprint",done); };
  addEventListener("afterprint",done); setTimeout(()=>window.print(),80); }
// if the PDF can't be built (e.g. Safari on iPad refuses to read back the drawn page) offer the browser's print dialog,
// where "Save as PDF" gives a PDF with real, searchable text
async function exportPdf(html, name){
  try{
    if(!window.jspdf) throw Object.assign(new Error("no jspdf"),{code:"no_jspdf"});
    toast("กำลังสร้าง PDF…");
    const blob=await buildPdf(html);
    await saveFile(name, blob); toast("บันทึกไฟล์แล้ว");
  }catch(e){ if(e?.code==="declined") return; console.error(e);
    if(e?.code==="rate_limited"){ toast("มีหน้าต่างบันทึกไฟล์เปิดอยู่ ลองอีกครั้ง"); return; }
    if(await confirmBox("สร้าง PDF ไม่สำเร็จ","เบราว์เซอร์นี้สร้างไฟล์ PDF ไม่ได้ ใช้การพิมพ์ของเบราว์เซอร์แทนได้ (เลือกเครื่องพิมพ์ หรือ “บันทึกเป็น PDF”)","พิมพ์")) printPages(html); }
}

/* --- ทะเบียนคุมแบบพิมพ์: รับเข้าเป็นช่วงเลขที่ ใช้ออกทีละแผ่น --- */
const FORM_TYPES=["ปพ.๑ : ป","ปพ.๑ : บ","ปพ.๑ : พ","ปพ.๒ : บ","ปพ.๒ : พ"];
const USE_PURPOSES=["จบการศึกษา","ย้ายออก","ลาออก","ขอฉบับใหม่ (ชำรุด/สูญหาย)"];
function stockOf(type){
  const rs=state.forms.filter(f=>f.formType===type && !f.canceled);
  const rec=rs.filter(f=>f.kind==="receive").sort((a,b)=>String(a.date).localeCompare(b.date));
  const uses=rs.filter(f=>f.kind==="use").sort((a,b)=>(+a.serial)-(+b.serial));
  const all=new Set(); rec.forEach(r=>{ for(let n=+r.start;n<=+r.end;n++) all.add(n); });
  const used=new Set(uses.map(u=>+u.serial)); const free=[...all].filter(n=>!used.has(n)).sort((a,b)=>a-b);
  return {rec, uses, all, free, used:uses.filter(u=>u.status!=="spoiled").length, spoiled:uses.filter(u=>u.status==="spoiled").length};
}
function lowStockHTML(){ const lim=numIn(state.school.formLow)||10;
  const low=FORM_TYPES.map(t=>[t,stockOf(t)]).filter(([,x])=>x.all.size && x.free.length<=lim);
  return low.length ? `<div class="warnline" style="margin-bottom:20px">แบบพิมพ์ใกล้หมด: ${low.map(([t,x])=>`${h(t)} เหลือ ${D(x.free.length)} แผ่น`).join(", ")} — ทำหนังสือขอซื้อได้ที่แท็บ “หนังสือราชการ”</div>` : ""; }
async function cancelStock(id){ const f=state.forms.find(x=>x._id===id); if(!f) return;
  if(!await confirmBox("ยกเลิกรายการ",`ยกเลิกรายการ${f.kind==="receive"?`รับเข้าเลขที่ ${D(f.start)}–${D(f.end)}`:`เลขที่ ${D(f.serial)}`}? รายการยังอยู่ในฐานข้อมูลโดยมีเครื่องหมายยกเลิก`,"ยกเลิกรายการ")) return;
  try{ const b={...f,canceled:true,canceledAt:new Date().toISOString()}; delete b._id; await saveDoc("forms",id,b); toast("ยกเลิกแล้ว"); }catch(e){ writeErr(e); } }

      ${fIn("closing","ข้อความปิดท้าย",o.closing,{area:2})}`

function letterNums(){ const isOrder=lt.kind==="order", o=isOrder?od:pd, y=docYear(o.date), ser=isOrder?"order":"out"; const seq=numIn(o.seq)||nextSeq(y,ser); return {y,ser,seq,seq2:isOrder?0:seq+1}; }
function letterDraft(){ const n=letterNums(); return lt.kind==="order" ? orderHTML({...od, number:`${n.seq}/${n.y}`}) : purchaseHTML({...pd, seq:n.seq, seq2:n.seq2}); }
function drawLetterPreview(){ const sc=$("#ltScale"); if(!sc) return; sc.innerHTML=letterDraft(); fitIn($("#ltWrap"),sc);
  const n=letterNums(), warns=[];
  if(seqTaken(n.y,n.ser,n.seq) || (n.seq2 && seqTaken(n.y,n.ser,n.seq2))) warns.push(`เลขที่ ${D(n.seq)}${n.seq2?`–${D(n.seq2)}`:""} ถูกใช้ไปแล้วในปี ${D(n.y)} เปลี่ยนเลขหรือเว้นว่างให้ระบบรันเลขเอง`);

  [...sc.children].forEach((pg,i)=>{ if(pg.scrollHeight>pg.clientHeight+2) warns.push(`หน้า ${D(i+1)} เนื้อหายาวเกินหนึ่งหน้า ตัดข้อความให้สั้นลง`); });

async function issueOrder(){ if(!regOK()) return; const n=letterNums();

  if(!od.roles.some(r=>String(r.name).trim())){ toast("กรอกชื่อผู้ได้รับแต่งตั้งอย่างน้อย ๑ คน"); return; }
  const number=`${n.seq}/${n.y}`;

  try{ const rec=await saveRegister({type:"order", series:"order", seq:n.seq, year:n.y, number:`คำสั่งที่ ${number}`, date:od.date, studentName:od.subject, purpose:"", data});
    await saveSchool({...state.school, orderDefaults:{subject:od.subject, pre:od.pre, closing:od.closing, roles:od.roles.map(r=>({...r}))}});
    od.seq=""; toast(`ออกคำสั่งที่ ${D(number)} แล้ว`); drawLetters(); deliver(orderHTML(data), `คำสั่งที่${number.replace("/","-")}_${od.subject}.pdf`, `คำสั่งที่ ${number}`);

async function issuePurchase(){ if(!regOK()) return; const n=letterNums();

  if(!String(pd.name).trim()){ toast("กรอกชื่อผู้ดำเนินการจัดซื้อ"); return; }

  const full={...pd, qty:{...pd.qty}, seq:n.seq, seq2:n.seq2}; const data={...full, cid:""};
  const items=PURCHASE_ITEMS.filter(i=>numIn(pd.qty[i.k])>0).map(i=>`${i.code} ${numIn(pd.qty[i.k])} ${i.unit}`).join(", ");

function studentIssues(){
  const act=state.students.filter(s=>s.status==="active"); const cidN={}, sidN={};
  act.forEach(s=>{ if(s.citizenId) cidN[s.citizenId]=(cidN[s.citizenId]||0)+1; sidN[s.studentId]=(sidN[s.studentId]||0)+1; });
  return act.map(s=>{ const p=[];
    if(!s.citizenId) p.push("ไม่มีเลขประจำตัวประชาชน"); else if(!cidValid(s.citizenId)) p.push("เลขประจำตัวประชาชนไม่ถูกต้อง"); else if(cidN[s.citizenId]>1) p.push("เลขประจำตัวประชาชนซ้ำกับคนอื่น");
    if(sidN[s.studentId]>1) p.push("เลขประจำตัวนักเรียนซ้ำ");
    if(!GRADES.includes(s.grade)) p.push("ไม่ระบุชั้น"); if(!s.room) p.push("ไม่ระบุห้อง");
    if(!s.birthDate) p.push("ไม่มีวันเกิด");
    if(!s.gender && !["เด็กชาย","เด็กหญิง","นาย","นางสาว","นาง"].includes(s.prefix)) p.push("ไม่ระบุเพศ");
    if(!s.addrTambon || !s.addrAmphoe || !s.addrProvince) p.push("ที่อยู่ไม่ครบ (ตำบล อำเภอ จังหวัด)");
    if(!s.father && !s.mother && !s.guardian) p.push("ไม่มีชื่อบิดา มารดา หรือผู้ปกครอง");
    return {s,p}; }).filter(x=>x.p.length);
}

    const csv=[["ที่","เลขประจำตัว","เลขประจำตัวประชาชน","ชื่อ–สกุล","วันเกิด","วันที่สำเร็จการศึกษา"]].concat(list.map((s,i)=>[i+1,s.studentId,s.citizenId,fullName(s),thaiDateShort(s.birthDate),thaiDateShort(s.leaveDate)]));
    return {csv, note: noDate?`มีผู้สำเร็จการศึกษาชั้น ${g} อีก ${D(noDate)} คนที่ยังไม่มีวันที่จำหน่าย จึงไม่อยู่ในรายชื่อ`:"", html:`<div class="sheet">${sheetHead("รายชื่อผู้สำเร็จการศึกษา", `${h(gradeGrad(g))} ${yr}`)}
      <table><thead><tr><th>ที่</th><th>เลขประจำตัว</th><th>เลขประจำตัวประชาชน</th><th>ชื่อ – สกุล</th><th>วันเกิด</th><th>วันที่จบ</th></tr></thead><tbody>${list.map((s,i)=>`<tr><td class="c">${D(i+1)}</td><td class="c">${h(D(s.studentId||""))}</td><td class="c">${h(D(cidFmt(s.citizenId)))}</td><td>${h(fullName(s))}</td><td class="c">${h(D(thaiDateShort(s.birthDate)))}</td><td class="c">${h(D(thaiDateShort(s.leaveDate)))}</td></tr>`).join("") || `<tr><td colspan="6" class="c">ไม่มีผู้สำเร็จการศึกษาชั้นนี้ในปีการศึกษาที่เลือก</td></tr>`}</tbody></table>
      <div class="foot">${gcount(list)}</div>${signs("นายทะเบียน","ผู้อำนวยการ")}</div>`};
  }
  if(rp.kind==="movement"){
    const ins=state.students.filter(s=>inAcadYear(s.moveInDate,year)).sort((a,b)=>a.moveInDate.localeCompare(b.moveInDate));
    const outs=state.students.filter(s=>["moved","quit","grad"].includes(s.status) && inAcadYear(s.leaveDate,year)).sort((a,b)=>a.leaveDate.localeCompare(b.leaveDate));
    const csv=[["รับย้ายเข้า"],["ที่","วันที่รับ","เลขประจำตัว","ชื่อ–สกุล","ชั้น","มาจาก"]].concat(ins.map((s,i)=>[i+1,thaiDateShort(s.moveInDate),s.studentId,fullName(s),`${s.grade}/${s.room||""}`,s.moveInFrom]),[[],["จำหน่าย"],["ที่","วันที่","เลขประจำตัว","ชื่อ–สกุล","ชั้น","สาเหตุ","ไปที่ / เหตุผล"]],outs.map((s,i)=>[i+1,thaiDateShort(s.leaveDate),s.studentId,fullName(s),`${s.grade}/${s.room||""}`,STATUSES[s.status],[s.moveTo,s.moveReason].filter(Boolean).join(" ")]));
    return {csv, html:`<div class="sheet">${sheetHead("สมุดคุมการรับย้ายเข้าและจำหน่ายนักเรียน", yr)}
      <h5>๑. รับย้ายเข้า (${D(ins.length)} คน)</h5><table><thead><tr><th>ที่</th><th>วันที่รับ</th><th>เลขประจำตัว</th><th>ชื่อ – สกุล</th><th>ชั้น</th><th>ย้ายมาจาก</th></tr></thead><tbody>${ins.map((s,i)=>`<tr><td class="c">${D(i+1)}</td><td class="c">${h(D(thaiDateShort(s.moveInDate)))}</td><td class="c">${h(D(s.studentId||""))}</td><td>${h(fullName(s))}</td><td class="c">${h(s.grade||"")}${s.room?"/"+h(D(s.room)):""}</td><td class="wrap">${h(s.moveInFrom||"")}</td></tr>`).join("")||`<tr><td colspan="6" class="c">ไม่มี</td></tr>`}</tbody></table>
      <h5>๒. จำหน่ายออก (${D(outs.length)} คน)</h5><table><thead><tr><th>ที่</th><th>วันที่</th><th>เลขประจำตัว</th><th>ชื่อ – สกุล</th><th>ชั้น</th><th>สาเหตุ</th><th>ไปที่ / เหตุผล</th></tr></thead><tbody>${outs.map((s,i)=>`<tr><td class="c">${D(i+1)}</td><td class="c">${h(D(thaiDateShort(s.leaveDate)))}</td><td class="c">${h(D(s.studentId||""))}</td><td>${h(fullName(s))}</td><td class="c">${h(s.grade||"")}${s.room?"/"+h(D(s.room)):""}</td><td>${h(STATUSES[s.status])}</td><td class="wrap">${h([s.moveTo,s.moveReason].filter(Boolean).join(" "))}</td></tr>`).join("")||`<tr><td colspan="7" class="c">ไม่มี</td></tr>`}</tbody></table>
      ${signs("นายทะเบียน")}</div>`};
  }
  if(rp.kind==="cards"){
    const keys=rp.cls?[rp.cls]:classesOf(act); const list=keys.flatMap(k=>{ const [g,r]=k.split("|"); return act.filter(s=>s.grade===g&&String(s.room||"")===r).sort(byGenderId); });
    const card=s=>`<div class="idcard"><div class="ch">${sc.logo?`<img src="${h(sc.logo)}" alt="">`:""}<span>บัตรประจำตัวนักเรียน<br>${h(sc.name||"(ชื่อสถานศึกษา)")}</span></div>
      <div class="ph">${s.photo?`<img src="${h(s.photo)}" alt="">`:"ติดรูปถ่าย"}</div>
      <div>${h(fullName(s))}<br>เลขประจำตัว ${h(D(s.studentId||""))}<br>ชั้น${h(gradeClass(s))}${s.birthDate?`<br>เกิด ${h(D(thaiDateShort(s.birthDate)))}`:""}${s.citizenId?`<br>${h(D(cidFmt(s.citizenId)))}`:""}</div>
      <div class="cf"><span>${yr}</span><span>......................... ผู้อำนวยการ</span></div></div>`;
    const pages=[]; for(let i=0;i<list.length;i+=10) pages.push(`<div class="sheet cards">${list.slice(i,i+10).map(card).join("")}</div>`);
    const noPhoto=list.filter(s=>!s.photo).length;
    return {html:pages.join("")||`<div class="empty">ยังไม่มีนักเรียนที่กำลังศึกษา</div>`, note: noPhoto?`${D(noPhoto)} คนยังไม่มีรูปถ่าย (เพิ่มได้ในฟอร์มแก้ไขนักเรียน หรือเว้นไว้ให้ติดรูปจริง)`:""};
  }
}
function renderReports(){
  const el=$("#v-reports");
  if(!el.dataset.built){ el.dataset.built="1";
    el.innerHTML=`<h2>รายงาน</h2><p class="sub">เลือกรายงาน ตรวจตัวอย่าง แล้วกด “พิมพ์” (ในหน้าต่างพิมพ์เลือก “บันทึกเป็น PDF” ได้) หรือส่งออก CSV ไปเปิดใน Excel</p>
      <div class="toolbar"><select id="rpKind" aria-label="รายงาน">${Object.entries(REPORTS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
      <div class="panel" id="rpParams" style="margin-bottom:16px"></div><div id="rpOut"></div>`;
    $("#rpKind").addEventListener("change",e=>{ rp.kind=e.target.value; rp.year=""; drawReportParams(); drawReport(); }); drawReportParams(); }
  else if(!$("#rpParams").contains(document.activeElement)) drawReportParams();
  drawReport();
}
function drawReportParams(){
  const act=state.students.filter(s=>s.status==="active"); const k=rp.kind; const year=rp.year||reportDefaultYear();
  const clsSel=`<label class="f" for="rpCls">ชั้น/ห้อง<select id="rpCls"><option value="">ทุกห้อง</option>${classesOf(act).map(c=>`<option value="${h(c)}" ${c===rp.cls?"selected":""}>${h(clsName(c))}</option>`).join("")}</select></label>`;
  const yearSel=`<label class="f" for="rpYear">ปีการศึกษา<select id="rpYear">${acadYears().map(y=>`<option ${String(y)===String(year)?"selected":""}>${y}</option>`).join("")}</select></label>`;
  const f = k==="roster" ? `${clsSel}<label class="f" for="rpTitle">หัวรายงาน<input id="rpTitle" value="${h(rp.title)}"></label><label class="f" for="rpBlanks">จำนวนช่องว่าง (สำหรับเช็กชื่อ/กรอกคะแนน)<input id="rpBlanks" inputmode="numeric" value="${h(rp.blanks)}"></label>${yearSel}`
    : k==="stats" ? `<label class="f" for="rpRef">นับอายุถึงวันที่<input type="date" id="rpRef" value="${h(rp.ref)}"></label>${yearSel}`
    : k==="grads" ? `${yearSel}<label class="f" for="rpGrade">ชั้น<select id="rpGrade"><option value="">อัตโนมัติ (ชั้นสูงสุดที่มีผู้จบ)</option>${GRADES.map(g=>`<option ${g===rp.grade?"selected":""}>${g}</option>`).join("")}</select></label>`
    : k==="movement" ? yearSel : k==="cards" ? `${clsSel}${yearSel}` : "";
  const printable=k!=="check";
  $("#rpParams").innerHTML=`${f?`<div class="fgrid" style="margin-bottom:12px">${f}</div>`:""}<div class="row">${printable?`<button class="btn primary" id="rpPrint">พิมพ์</button>`:""}${k!=="cards"?`<button class="btn" id="rpCsv">ส่งออก CSV</button>`:""}<span class="hint" id="rpNote"></span></div>`;
  const on=(id,key,ev="input")=>$(id)?.addEventListener(ev,e=>{ rp[key]=e.target.value; drawReport(); });
  on("#rpCls","cls","change"); on("#rpTitle","title"); on("#rpBlanks","blanks"); on("#rpYear","year","change"); on("#rpRef","ref","change"); on("#rpGrade","grade","change");
  $("#rpPrint")?.addEventListener("click",()=>{ const r=buildDoc(); printPages(r.html); });
  $("#rpCsv")?.addEventListener("click",()=>{ const r=buildReport(); saveText(`${REPORTS[rp.kind].split(" ")[0]}_${todayISO()}.csv`, r.csv.map(row=>row.map((v,i)=>csvCell(v)).join(",")).join("\r\n")); });
}
function drawReport(){ const r=rp.kind==="check"?buildReport():buildDoc(); $("#rpNote").textContent=r.note||""; $("#rpOut").innerHTML = r.screen ? r.html : `<div class="sheet-wrap">${r.html}</div>`; }

    el.innerHTML=`<div class="row spread" style="margin-bottom:4px"><h2>ทะเบียนคุมเอกสาร</h2><div class="row"><button class="btn" data-act="reserve-out">จองเลขหนังสือส่ง</button><button class="btn" data-act="export-log">ส่งออก CSV</button></div></div><p class="sub" id="lgCount"></p><div id="lgDup"></div>

function drawLog(){
  const q=lf.q.trim().toLowerCase();
  const list=state.issued.filter(d=>(!lf.type||d.type===lf.type)&&(!q||[d.number,d.studentName,d.purpose,d.studentId].some(v=>String(v||"").toLowerCase().includes(q))));
  $("#lgCount").textContent=`ทั้งหมด ${D(state.issued.length)} ฉบับ · ปี ${D(beYearNow())} ออกไปแล้ว ${D(state.issued.filter(d=>d.year===beYearNow()&&!d.voided).length)} ฉบับ (ไม่นับที่ยกเลิก)`;
  const cnt={}; state.issued.filter(d=>!d.voided).forEach(d=>cnt[d.number]=(cnt[d.number]||0)+1); const dups=Object.keys(cnt).filter(k=>cnt[k]>1);
  $("#lgDup").innerHTML = dups.length ? `<div class="warnline" style="margin-bottom:12px">พบเลขที่หนังสือซ้ำ: ${h(dups.map(D).join(", "))} ให้ยกเลิกฉบับที่ออกทีหลังแล้วออกเลขใหม่</div>` : "";
  $("#lgTable").innerHTML = !state.issued.length ? `<div class="panel empty"><b>ยังไม่มีเอกสารในทะเบียนคุม</b>ทุกฉบับที่ออกจากแท็บ “ออกเอกสาร” จะถูกบันทึกที่นี่พร้อมเลขที่ ใช้พิมพ์ซ้ำหรือยกเลิกเลขได้</div>`
   : !list.length ? `<div class="panel empty"><b>ไม่พบเอกสารตามเงื่อนไข</b></div>`
   : `<div class="tablebox"><table><thead><tr><th>เลขที่</th><th>ลงวันที่</th><th>ประเภท</th><th>นักเรียน / เรื่อง</th><th>ชั้น</th><th>ใช้เพื่อ / เรียน</th><th></th></tr></thead><tbody>${list.map(d=>`<tr${d.voided?' style="opacity:.55"':""}><td class="mono">${h(D(d.number))}${d.voided?` <span class="chip s-quit">ยกเลิก</span>${d.voidReason?`<br><small class="hint">${h(d.voidReason)}</small>`:""}`:""}</td><td>${h(thaiDateShort(d.date))}</td><td>${h(typeName(d.type))}</td><td>${h(d.studentName)}</td><td>${h(d.grade)}${d.room?"/"+h(d.room):""}</td><td>${h(d.purpose||"–")}</td>
     <td><div class="row" style="gap:6px;flex-wrap:nowrap">${d.type==="outgoing"?"":`<button class="btn sm" data-act="reprint" data-id="${h(d._id)}" ${d.voided?"disabled":""}>ดาวน์โหลด PDF</button><button class="btn sm" data-act="print-rec" data-id="${h(d._id)}" ${d.voided?"disabled":""}>พิมพ์</button>`}${d.voided?"":`<button class="btn sm danger" data-act="void" data-id="${h(d._id)}">ยกเลิกเลข</button>`}</div></td></tr>`).join("")}</tbody></table></div>`;
}

// student photo: small JPEG (about 15 KB) so 1,000 students still fit in the database
function shrinkPhoto(file){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onerror=()=>{URL.revokeObjectURL(u);rej();};
  img.onload=()=>{ const k=Math.min(1,320/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.82)); }; img.src=u; }); }
function shrinkImage(file,max){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
  const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/png")); }; img.src=r.result; }; r.readAsDataURL(file); }); }

    }catch(err){ writeErr(err); } });

// กันสูตรที่ฝังมาในข้อมูล (CSV injection): ช่องที่ขึ้นต้นด้วย = + @ หรือ - ตามด้วยตัวอักษร จะมี ' นำหน้า
const csvCell = v => { v=String(v??""); if(/^[=+@\t\r]/.test(v) || /^-[^\d\s]/.test(v)) v="'"+v; return /[",\n\r]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
// Excel แปลงเลขยาว ๆ เป็น 1.1E+12 และตัดเลข 0 นำหน้า จึงเขียนเป็นข้อความ ="..."
const CSV_TEXT_KEYS=["studentId","citizenId","phone"];
const csvText = v => { v=String(v??""); return /^\d{10,}$|^0\d+$/.test(v) ? `="${v}"` : csvCell(v); };
function parseCSV(text){ const rows=[]; let row=[],cur="",q=false; text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===","){row.push(cur);cur="";} else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=c; }
  if(cur||row.length){row.push(cur);rows.push(row);} return rows.filter(r=>r.some(x=>x.trim())); }
// accept Thai dates like 15/05/2556 (พ.ศ.) or ISO
function normDate(v){ v=(v||"").trim(); if(!v) return ""; if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ const y=+v.slice(0,4); return y>2400 ? `${y-543}${v.slice(4)}` : v; }
  const m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); if(m){ let y=+m[3]; if(y>2400) y-=543; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; } return ""; }
function normStatus(v){ v=(v||"").trim(); if(!v) return "active"; if(STATUSES[v]) return v; const f=Object.entries(STATUSES).find(([,t])=>t===v || v.includes(t.slice(0,4))); return f?f[0]:"active"; }
function normGrade(v){ v=String(v||"").replace(/[๐-๙]/g,c=>"๐๑๒๓๔๕๖๗๘๙".indexOf(c)).replace(/\s/g,"").replace(/^ชั้น/,"")
    .replace(/ประถมศึกษาปีที่|ประถม/,"ป.").replace(/มัธยมศึกษาปีที่|มัธยม/,"ม.").replace(/อนุบาลปีที่|อนุบาล/,"อ.").replace(/^([อปม])\.*(\d)$/,"$1.$2"); return GRADES.includes(v)?v:""; }

const HEAD_ALIASES = {"คำนำหน้าชื่อ":"prefix","กลุ่มเลือด":"bloodType","หมู่":"addrMoo","ถนน/ซอย":"addrRoad","บ้านเลขที่":"addrNo",

  "คำนำหน้าชื่อผู้ปกครอง":"_gP","ชื่อผู้ปกครอง":"_gF","นามสกุลผู้ปกครอง":"_gL","คำนำหน้าชื่อบิดา":"_fP","ชื่อบิดา":"_fF","นามสกุลบิดา":"_fL",
  "คำนำหน้าชื่อมารดา":"_mP","ชื่อมารดา":"_mF","นามสกุลมารดา":"_mL","เลขบัตรประชาชน":"citizenId","เลขประจำตัวประชาชน 13 หลัก":"citizenId","น้ำหนัก(กก.)":"weight","ส่วนสูง(ซม.)":"height"};
const BLANK = v => /^(-|–|ไม่มี|ไม่ปรากฏ|ไม่ปรากฎ)$/.test(v);
const joinName = (p,f,l) => (!f || BLANK(f)) ? "" : (p&&!BLANK(p)?p:"")+f+(l&&!BLANK(l)?" "+l:"");
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>{ s.remove(); rej(new Error("load")); }; document.head.appendChild(s); }); }
// .xlsx/.xls straight from DMC: the reader library is fetched only when an Excel file is chosen
async function readXlsx(f){
  if(!window.XLSX){ try{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }catch{ throw new Error("อ่านไฟล์ Excel ไม่ได้ ต้องต่ออินเทอร์เน็ตเพื่อโหลดตัวอ่านไฟล์ หรือบันทึกไฟล์จาก Excel เป็น CSV แล้วนำเข้าแทน"); } }
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
  const cell=x=> x instanceof Date ? `${x.getDate()}/${x.getMonth()+1}/${x.getFullYear()}` : String(x??"");
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}).map(r=>r.map(cell)).filter(r=>r.some(x=>x.trim()));
}
async function readTextFile(f){ const buf=await f.arrayBuffer();
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch{ try{ return new TextDecoder("windows-874").decode(buf); }catch{ return new TextDecoder().decode(buf); } } }
function mapImportRows(rows){
  // skip report lines above the header (DMC puts the export time on the first line)
  const hi=rows.findIndex(r=>r.some(x=>x.trim()==="ชื่อ")); if(hi<0) return null;
  const head=rows[hi].map(x=>x.trim());
  const keys=head.map(x=>{ const c=CSV_COLS.find(([k,l])=>x===l||x===k); return c?c[0]:(HEAD_ALIASES[x]||null); });
  const hasStatus=keys.includes("status"); const problems=[];
  const out=rows.slice(hi+1).map((r,i)=>{ const o={};
    keys.forEach((k,j)=>{ if(!k) return; let v=(r[j]||"").trim(); if(BLANK(v)) v="";
      if(/^="?[^"]*"?$/.test(v)) v=v.replace(/^="?|"$/g,""); else if(/^'[=+@\-]/.test(v)) v=v.slice(1);
      // DMC has two "เลขประจำตัวนักเรียน" columns: the 13-digit one is the citizen ID
      if(k==="studentId" && /^(\d{13}|G\d{12})$/.test(cidClean(v))){ if(!o.citizenId) o.citizenId=v; return; }
      if(v || o[k]===undefined) o[k]=v; });
    [["_g","guardian"],["_f","father"],["_m","mother"]].forEach(([p,k])=>{ if(o[p+"F"]!==undefined && !o[k]) o[k]=joinName(o[p+"P"],o[p+"F"],o[p+"L"]); delete o[p+"P"]; delete o[p+"F"]; delete o[p+"L"]; });
    if(o.gender) o.gender={"ช":"ชาย","ญ":"หญิง","ชาย":"ชาย","หญิง":"หญิง"}[o.gender]||o.gender;
    ["weight","height"].forEach(k=>{ if(o[k]!==undefined && !(parseFloat(o[k])>0)) o[k]=""; });
    o.citizenId=cidClean(o.citizenId); DATE_KEYS.forEach(k=>{ if(o[k]!==undefined) o[k]=normDate(o[k]); });
    if(hasStatus) o.status=normStatus(o.status);
    const g=normGrade(o.grade); if(o.grade && !g) problems.push(`แถว ${hi+i+2}: ไม่รู้จักชั้น “${o.grade}” นำเข้าโดยยังไม่ระบุชั้น ให้แก้ภายหลัง`); o.grade=g;
    if(ADDR_KEYS.some(k=>o[k])) Object.assign(o, cleanAddr(o)); else if(o.address) Object.assign(o, parseAddr(o.address));
    if(ADDR_KEYS.some(k=>o[k])) o.address=composeAddr(o);
    const line=hi+i+2;
    if(!o.studentId||!o.firstName) problems.push(`แถว ${line}: ไม่มีเลขประจำตัวหรือชื่อ (ข้าม)`); else if(o.citizenId && !cidValid(o.citizenId)) problems.push(`แถว ${line}: เลขประชาชนของ ${o.firstName} ไม่ถูกต้อง (นำเข้าแต่ควรตรวจ)`);
    return o; }).filter(o=>o.studentId&&o.firstName);
  return {rows:out, problems, hasFirst:keys.includes("firstName")};
}
